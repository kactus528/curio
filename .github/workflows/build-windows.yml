name: Build Windows VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -A x64 -DCURIO_STANDALONE=OFF 2>&1 | tee configure.log \
            || { echo "::error title=configure::$(tail -c 6000 configure.log | tr '\n' ' ')"; exit 1; }

      - name: Engine tests (offline render, all 8 engines)
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target curio_render_test 2>&1 | tee test-build.log \
            || { echo "::error title=test build::$(grep -E 'error' test-build.log | tail -c 6000 | tr '\n' ' ')"; exit 1; }
          mkdir -p renders && cd renders && ../build/Release/curio_render_test.exe

      - name: Build plugins
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel --target Jitter_VST3 Repitch_VST3 Duck_VST3 KeytrackRes_VST3 CombPluck_VST3 Manifest_VST3 Mudpie_VST3 SpectralOTT_VST3 curio_smoke 2>&1 | tee build.log \
            || { echo "::error title=build::$(grep -E 'error [A-Z]+[0-9]+|fatal error|exited with code' build.log | grep -v 'MSB3073: *(setlocal|if %|:cm|endlocal|exit /b|\"C:)' | sort -u | tail -c 5000 | tr '\n' ' ')"; exit 1; }

      - name: Smoke test (load each VST3 like a DAW, every preset, editor)
        shell: bash
        run: |
          set -o pipefail
          ARGS=""
          for p in Jitter Repitch Duck KeytrackRes CombPluck Manifest Mudpie SpectralOTT; do ARGS="$ARGS build/${p}_artefacts/Release/VST3/$p.vst3"; done
          ls -la build/curio_smoke_artefacts/Release/ || true
          set +e
          build/curio_smoke_artefacts/Release/curio_smoke.exe $ARGS > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          if [ $code -ne 0 ]; then echo "::error title=smoke (exit $code)::$(tail -c 4000 smoke.log | tr -d '\r' | tr '\n' '|')"; exit 1; fi
          echo "::notice title=smoke::$(grep -E 'PASS|FAIL' smoke.log | tr '\n' ' ')"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Curio | Out-Null
          foreach ($p in "Jitter","Repitch","Duck","KeytrackRes","CombPluck","Manifest","Mudpie","SpectralOTT") {
            Copy-Item -Recurse "build/${p}_artefacts/Release/VST3/$p.vst3" out/Curio/
          }
          Copy-Item README.md out/Curio/
          Compress-Archive -Path out/Curio -DestinationPath Curio-Windows-VST3.zip -Force
          # one zip per plugin, for individual download links
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item Curio-Windows-VST3.zip dist/
          foreach ($p in "Jitter","Repitch","Duck","KeytrackRes","CombPluck","Manifest","Mudpie","SpectralOTT") {
            Compress-Archive -Path "out/Curio/$p.vst3" -DestinationPath "dist/$p-Windows-VST3.zip" -Force
          }
          Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Curio-Windows-VST3
          path: out/Curio

      - name: Publish as a GitHub Release (stable download link)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest dist/*.zip \
            --title "Curio for Windows (latest build)" \
            --notes "Curio VST3 plugins for Windows (64-bit). Curio-Windows-VST3.zip has all eight; the other zips are one plugin each. Unzip and copy the .vst3 folders into C:\\Program Files\\Common Files\\VST3, then rescan plugins in Ableton." \
            --target "${{ github.sha }}"
